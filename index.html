<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111820">
<title>Кухня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: var(--tg-theme-bg-color, #111820);
    --card: var(--tg-theme-secondary-bg-color, #1b2631);
    --text: var(--tg-theme-text-color, #f3f6f8);
    --hint: var(--tg-theme-hint-color, #91a0ae);
    --accent: var(--tg-theme-button-color, #63b891);
    --accent-text: var(--tg-theme-button-text-color, #081810);
    --line: rgba(255,255,255,.09);
    --soft: rgba(255,255,255,.045);
    --shadow: 0 8px 24px rgba(0,0,0,.18);
    /* мягкие акценты разделов карт */
    --c0: #dd8a72; /* вторые блюда */
    --c1: #8cbd85; /* салаты и закуски */
    --c2: #cdb06a; /* гарниры */
    --c3: #d96a5c; /* супы */
    --c4: #a8c4da; /* каши и завтраки */
    --c5: #cf9a5e; /* бутерброды и выпечка */
    --c6: #b69ad0; /* напитки и добавки */
    --c7: #7db6c6; /* полуфабрикаты */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* бледный кухонный узор: ложка, вилка, чашка, нож */
  :root {
    --pattern: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><g fill='none' stroke='%23ffffff' stroke-opacity='0.045' stroke-width='1.6' stroke-linecap='round'><path d='M40 26v30a10 10 0 0 0 20 0V26'/><path d='M50 26v66'/><circle cx='150' cy='40' r='12'/><path d='M150 52v40'/><path d='M96 30h26v14a13 13 0 0 1-13 13h0a13 13 0 0 1-13-13z'/><path d='M109 57v35'/><path d='M186 120l-16 16 8 8 16-16z'/><path d='M162 144l-8 8 10 10 8-8'/><path d='M36 150c0-12 10-22 22-22s22 10 22 22-10 22-22 22-22-10-22-22z'/><path d='M58 172v26'/><path d='M120 130v46'/><path d='M120 130c0-8 6-14 14-14s14 6 14 14-6 14-14 14-14-6-14-14z'/></g></svg>");
    --pattern-light: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><g fill='none' stroke='%23000000' stroke-opacity='0.05' stroke-width='1.6' stroke-linecap='round'><path d='M40 26v30a10 10 0 0 0 20 0V26'/><path d='M50 26v66'/><circle cx='150' cy='40' r='12'/><path d='M150 52v40'/><path d='M96 30h26v14a13 13 0 0 1-13 13h0a13 13 0 0 1-13-13z'/><path d='M109 57v35'/><path d='M186 120l-16 16 8 8 16-16z'/><path d='M162 144l-8 8 10 10 8-8'/><path d='M36 150c0-12 10-22 22-22s22 10 22 22-10 22-22 22-22-10-22-22z'/><path d='M58 172v26'/><path d='M120 130v46'/><path d='M120 130c0-8 6-14 14-14s14 6 14 14-6 14-14 14-14-6-14-14z'/></g></svg>");
  }
  body {
    margin: 0;
    padding: max(10px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    background: var(--bg);
    background: var(--pattern) repeat, var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .01em;
    -webkit-font-smoothing: antialiased;
  }
  /* тёмная тема — мягкий градиент поверх узора */
  body:not(.light) {
    background:
      var(--pattern) repeat,
      radial-gradient(130% 60% at 50% -20%, rgba(140,170,205,.07), transparent 55%),
      radial-gradient(120% 70% at 100% 110%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 60%),
      linear-gradient(180deg,
        color-mix(in srgb, var(--bg) 96%, white) 0%,
        var(--bg) 45%,
        color-mix(in srgb, var(--bg) 93%, black) 100%);
    background-attachment: fixed, fixed, fixed, fixed;
  }
  /* светлая тема — только узор, без тёмных градиентов */
  body.light {
    background: var(--pattern-light) repeat, var(--bg);
    background-attachment: fixed, fixed;
  }
  button, input { font: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  .tabs {
    display: flex; gap: 6px; margin: 0 -4px 16px; padding: 7px 4px;
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(14px);
  }
  .tab {
    flex: 1; min-height: 44px; padding: 10px 6px;
    font-size: 14px; font-weight: 650; color: var(--hint);
    background: var(--soft); border: 1px solid transparent; border-radius: 13px;
    transition: background .16s ease, color .16s ease, transform .12s ease;
  }
  .tab:active, button:active { transform: scale(.965); }
  button.go, .catbtn, .cardbtn, .weeknav button {
    transition: transform .12s ease, opacity .12s ease, background .16s ease, border-color .16s ease;
  }
  .tab.active {
    color: var(--accent-text); background: var(--accent);
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  label {
    display: block; font-size: 13px; font-weight: 600; color: var(--hint);
    margin-bottom: 8px;
  }
  input {
    width: 100%; min-height: 48px; padding: 12px 14px;
    font-size: 16px; color: var(--text); background: rgba(0,0,0,.16);
    border: 1px solid var(--line); border-radius: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--hint); opacity: .72; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .row { display: flex; gap: 9px; }
  .row > div { flex: 1; min-width: 0; }
  .subtabs { display: flex; gap: 7px; margin: 0 0 12px; }
  .subtabs .tab { min-height: 42px; font-size: 13px; padding: 9px 6px; }
  button.go {
    width: 100%; min-height: 52px; padding: 13px 16px; margin-top: 5px;
    font-size: 16px; font-weight: 700; color: var(--accent-text);
    background: var(--accent); border: none; border-radius: 15px;
    box-shadow: 0 5px 14px rgba(0,0,0,.17);
  }
  button.go:active { opacity: .88; }
  button.ghost { background: rgba(255,255,255,.08); color: var(--text); box-shadow: none; }
  .mini { font-size: 13px; }
  .err { color: #ff938b; font-size: 14px; margin: 8px 2px; min-height: 18px; }
  .head { font-size: 15px; margin: 18px 0 10px; color: var(--hint); line-height: 1.65; }
  .head b { color: var(--text); font-weight: 700; }
  .cat {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .09em; color: var(--accent); margin: 18px 0 5px;
  }
  .item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 11px 2px; border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .qty { color: var(--accent); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .total { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--hint); }
  .hidden { display: none; }
  .tip { font-size: 12px; line-height: 1.5; color: var(--hint); margin-top: 8px; }
  .tip b { color: var(--accent); font-weight: 700; }

  /* меню */
  .days { display: grid; grid-template-columns: minmax(0, 1fr); gap: 11px; }
  .daycard {
    background: var(--card); border: 1px solid var(--line); border-radius: 17px;
    padding: 14px 15px; box-shadow: 0 5px 18px rgba(0,0,0,.13);
  }
  .dayhead { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .dayhead span { color: var(--hint); font-weight: 500; font-size: 12px; }
  .daycard.today {
    border: 1px solid color-mix(in srgb, var(--accent) 72%, white);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent), 0 8px 24px rgba(0,0,0,.2);
    background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 10%, var(--card)), var(--card) 58%);
  }
  .daycard.today .dayhead { color: var(--accent); }
  .mlabel {
    color: var(--hint); font-size: 12px; font-weight: 750; text-transform: uppercase;
    letter-spacing: .08em; margin: 12px 0 4px;
  }
  .dishrow { display: flex; align-items: baseline; font-size: 13px; line-height: 1.45; padding: 3px 0; }
  .dishrow .num { color: var(--hint); width: 20px; flex: none; font-variant-numeric: tabular-nums; }
  .dishrow .name { flex: 1; }
  .dishrow .out { color: var(--accent); white-space: nowrap; padding-left: 8px; font-size: 12px; font-weight: 650; }
  .weeknav { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .weeknav input { flex: 1; min-width: 0; text-align: center; font-weight: 650; }
  .weeknav button {
    flex: none; width: 48px; height: 48px; font-size: 17px; font-weight: 700;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--text);
  }
  .weeknav .todaybtn {
    width: auto; padding: 0 16px; font-size: 14px; font-weight: 700;
    background: var(--accent); color: var(--accent-text); border-color: transparent;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }

  /* карты */
  .catbtn {
    display: block; width: 100%; min-height: 50px; text-align: left;
    padding: 13px 15px; margin-bottom: 8px; font-size: 15px;
    color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .catbtn.back {
    color: var(--accent); background: transparent; border-color: transparent;
    box-shadow: none; font-weight: 700; padding-left: 4px;
  }
  .cardbtn {
    display: block; width: 100%; min-height: 48px; text-align: left;
    padding: 12px 14px; margin-bottom: 7px; font-size: 14px;
    color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 13px;
  }
  .coutput { color: var(--hint); font-size: 12px; font-weight: 500; }

  /* ── плавное появление карточек и списков ── */
  @keyframes rise {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: none; }
  }
  .card, .daycard, .catbtn, .cardbtn, .item, .head, .total { animation: rise .2s ease both; }
  .days .daycard:nth-child(2) { animation-delay: .04s; }
  .days .daycard:nth-child(3) { animation-delay: .07s; }
  .days .daycard:nth-child(4) { animation-delay: .10s; }
  .days .daycard:nth-child(5) { animation-delay: .13s; }
  .days .daycard:nth-child(6) { animation-delay: .16s; }
  .days .daycard:nth-child(7) { animation-delay: .19s; }
  #cardCats .catbtn:nth-child(2), #cardList .cardbtn:nth-child(2), #list .item:nth-child(2) { animation-delay: .03s; }
  #cardCats .catbtn:nth-child(3), #cardList .cardbtn:nth-child(3), #list .item:nth-child(3) { animation-delay: .06s; }
  #cardCats .catbtn:nth-child(4), #cardList .cardbtn:nth-child(4), #list .item:nth-child(4) { animation-delay: .09s; }
  #cardCats .catbtn:nth-child(5), #cardList .cardbtn:nth-child(5), #list .item:nth-child(5) { animation-delay: .12s; }
  #cardCats .catbtn:nth-child(6), #cardList .cardbtn:nth-child(6), #list .item:nth-child(6) { animation-delay: .12s; }
  #cardCats .catbtn:nth-child(7), #cardList .cardbtn:nth-child(7), #list .item:nth-child(7) { animation-delay: .15s; }
  #cardCats .catbtn:nth-child(8), #cardList .cardbtn:nth-child(8), #list .item:nth-child(8) { animation-delay: .18s; }
  @media (prefers-reduced-motion: reduce) {
    .card, .daycard, .catbtn, .cardbtn, .item, .head, .total { animation: none; }
  }

  /* ── иконки и мягкие акценты разделов карт ── */
  .catbtn[data-cat] { border-left: 3px solid var(--line); }
  .catbtn::before { margin-right: 9px; }
  .catbtn[data-cat="0"] { border-left-color: var(--c0); }
  .catbtn[data-cat="1"] { border-left-color: var(--c1); }
  .catbtn[data-cat="2"] { border-left-color: var(--c2); }
  .catbtn[data-cat="3"] { border-left-color: var(--c3); }
  .catbtn[data-cat="4"] { border-left-color: var(--c4); }
  .catbtn[data-cat="5"] { border-left-color: var(--c5); }
  .catbtn[data-cat="6"] { border-left-color: var(--c6); }
  .catbtn[data-cat="7"] { border-left-color: var(--c7); }
  .catbtn[data-cat="0"]::before { content: "🥩"; }
  .catbtn[data-cat="1"]::before { content: "🥗"; }
  .catbtn[data-cat="2"]::before { content: "🍚"; }
  .catbtn[data-cat="3"]::before { content: "🍲"; }
  .catbtn[data-cat="4"]::before { content: "🥣"; }
  .catbtn[data-cat="5"]::before { content: "🥪"; }
  .catbtn[data-cat="6"]::before { content: "☕"; }
  .catbtn[data-cat="7"]::before { content: "🧊"; }

  /* ── сегодняшний день читается сразу ── */
  .daycard.today { border-left: 3px solid color-mix(in srgb, var(--accent) 85%, white); }
  @media (min-width: 620px) {
    body { max-width: 760px; margin: 0 auto; }
    .days { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" id="tab-order">🧾 Заказ</button>
  <button class="tab" id="tab-menu">📅 Меню</button>
  <button class="tab" id="tab-cards">📖 Карты</button>
</div>

<!-- ================= ЗАКАЗ ================= -->
<div id="screen-order">
  <div class="subtabs">
    <button class="tab active" id="sub-dates">Даты</button>
    <button class="tab" id="sub-days">Дни цикла</button>
  </div>

  <div class="card">
    <div id="mode-dates">
      <label>С какого и по какое число</label>
      <div class="row">
        <div><input id="from" inputmode="numeric" placeholder="16.11" autocomplete="off"></div>
        <div><input id="to" inputmode="numeric" placeholder="18.11" autocomplete="off"></div>
      </div>
      <div class="tip" id="datenote">День 1 цикла — 16.11.2026</div>
    </div>
    <div id="mode-days" class="hidden">
      <label>Дни (например 15-17, 1,3,5 или 28-3)</label>
      <input id="days" inputmode="numeric" placeholder="1-3" autocomplete="off">
      <div class="tip">Меньше «с» = через конец цикла: 28-3</div>
    </div>
  </div>

  <div class="card">
    <label>Сколько человек</label>
    <div class="row">
      <div><input id="b" inputmode="numeric" placeholder="Завтрак"></div>
      <div><input id="l" inputmode="numeric" placeholder="Обед"></div>
      <div><input id="d" inputmode="numeric" placeholder="Ужин"></div>
    </div>
    <div style="margin-top:12px">
      <label>Запас сверх людей (можно 0)</label>
      <input id="reserve" inputmode="numeric" placeholder="0">
    </div>
  </div>

  <button class="go" id="go">Посчитать</button>
  <div class="err" id="err"></div>

  <div id="out" class="hidden">
    <div class="head" id="head"></div>
    <div id="list"></div>
    <div class="total" id="total"></div>
    <button class="go ghost" id="copy">Скопировать список</button>
  </div>
</div>

<!-- ================= МЕНЮ ================= -->
<div id="screen-menu" class="hidden">
  <div class="weeknav">
    <button id="prevWeek" aria-label="Предыдущая неделя">◀</button>
    <input id="weekDate" inputmode="numeric" placeholder="13.11" autocomplete="off">
    <button id="nextWeek" aria-label="Следующая неделя">▶</button>
    <button id="thisWeek" class="todaybtn">Сегодня</button>
  </div>
  <div class="tip" id="weeknote" style="margin:-4px 0 12px"></div>
  <div id="menuList"></div>
</div>

<!-- ================= КАРТЫ ================= -->
<div id="screen-cards" class="hidden">
  <div class="card">
    <div class="row">
      <div style="flex:2"><input id="cardQuery" placeholder="шницель куриный" autocomplete="off"></div>
      <div><button class="go" id="cardSearch">Найти</button></div>
    </div>
    <div class="tip" id="cardNote"></div>
  </div>

  <div id="cardCats"></div>

  <div id="cardNav" class="hidden">
    <button class="catbtn back" id="cardBack">← Разделы</button>
    <div class="tip" id="cardTitle" style="margin:0 0 10px"></div>
  </div>

  <div id="cardList"></div>

  <div id="cardView" class="hidden">
    <div class="card">
      <div class="dayhead" id="cardName"></div>
      <div class="row" style="margin-top:10px">
        <div style="flex:2"><input id="portions" inputmode="numeric" placeholder="Сколько порций" autocomplete="off"></div>
        <div><button class="go" id="cardCalc">Показать</button></div>
      </div>
    </div>
    <div id="cardOut"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="calc.js"></script>
<script>
(function () {
  var A = window.APP, D = window.DATA;
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  // светлая или тёмная — как в Telegram (в браузере — как в системе)
  var scheme = (tg && tg.colorScheme) ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.body.classList.toggle('light', scheme === 'light');

  var $ = function (id) { return document.getElementById(id); };
  function val(id) { return ($(id).value || '').trim(); }
  function num(id) { var v = val(id); return v === '' ? 0 : parseInt(v, 10) || 0; }

  // ---------- экраны ----------
  function showScreen(name) {
    ['order', 'menu', 'cards'].forEach(function (n) {
      $('screen-' + n).classList.toggle('hidden', n !== name);
      $('tab-' + n).classList.toggle('active', n === name);
    });
  }
  $('tab-order').addEventListener('click', function () { showScreen('order'); });
  $('tab-menu').addEventListener('click', function () { showScreen('menu'); renderMenu(); });
  $('tab-cards').addEventListener('click', function () { showScreen('cards'); renderCardCats(); });

  // ================= ЗАКАЗ =================
  var lastText = '', orderMode = 'dates';

  function setOrderMode(m) {
    orderMode = m;
    $('sub-dates').classList.toggle('active', m === 'dates');
    $('sub-days').classList.toggle('active', m === 'days');
    $('mode-dates').classList.toggle('hidden', m !== 'dates');
    $('mode-days').classList.toggle('hidden', m !== 'days');
  }
  $('sub-dates').addEventListener('click', function () { setOrderMode('dates'); });
  $('sub-days').addEventListener('click', function () { setOrderMode('days'); });

  function updateDateNote() {
    try {
      var f = A.parseDate(val('from'));
      var t = A.parseDate(val('to') || val('from'));
      var days = A.datesToDays(f, t);
      $('datenote').innerHTML = A.fmtDate(f) + ' — день ' + A.dateToDay(f) +
        (days.length > 1 ? ', дни цикла: <b>' + A.daysLabel(days) + '</b>' : '');
    } catch (e) {
      $('datenote').textContent = 'День 1 цикла — 16.11.2026';
    }
  }

  function currentDays() {
    if (orderMode === 'dates') {
      var f = A.parseDate(val('from'));
      var t = A.parseDate(val('to') || val('from'));
      return { days: A.datesToDays(f, t), label: A.fmtDate(f) + (val('to') ? ' – ' + A.fmtDate(t) : '') };
    }
    var days = A.parseDays(val('days'));
    if (!days.length) throw new Error('Укажи дни, например 1-3');
    return { days: days, label: A.daysLabel(days) };
  }

  function renderOrder() {
    var err = $('err'), out = $('out');
    try {
      var res = currentDays();
      var people = { 'Завтрак': num('b'), 'Обед': num('l'), 'Ужин': num('d') };
      if (!people['Завтрак'] && !people['Обед'] && !people['Ужин'])
        throw new Error('Укажи, сколько человек едят');
      var reserve = num('reserve');
      if (reserve < 0) throw new Error('Запас не может быть отрицательным');

      var items = A.calc(D.menu, D.recipes, res.days, people, reserve);
      var g = A.groupOrder(items, D.categories, D.units);
      if (!g.used) throw new Error('Заказ пустой — проверь дни и число людей');

      err.textContent = '';
      out.classList.remove('hidden');

      var peopleTxt = ['Завтрак', 'Обед', 'Ужин']
        .filter(function (m) { return people[m]; })
        .map(function (m) { return m.toLowerCase() + ' ' + people[m]; })
        .join(' · ');
      $('head').innerHTML = 'Заказ на <b>' + res.label + '</b><br>Люди: ' + peopleTxt +
        (reserve ? ' + запас ' + reserve : '');

      var html = '';
      g.groups.forEach(function (cat) {
        html += '<div class="cat">' + cat.title + '</div>';
        cat.items.forEach(function (it) {
          html += '<div class="item"><span>' + it.name + '</span><span class="qty">' +
                  it.qty + ' ' + it.unit + '</span></div>';
        });
      });
      $('list').innerHTML = html;
      $('total').textContent = 'Позиций: ' + g.used;

      lastText = 'Заказ на ' + res.label + '\nЛюди: ' + peopleTxt +
                 (reserve ? ' + запас ' + reserve : '') + '\n\n';
      g.groups.forEach(function (cat) {
        lastText += cat.title + '\n';
        cat.items.forEach(function (it) { lastText += '  ' + it.name + ' — ' + it.qty + ' ' + it.unit + '\n'; });
        lastText += '\n';
      });
      lastText += 'Позиций: ' + g.used;
    } catch (e) {
      err.textContent = e.message;
      out.classList.add('hidden');
    }
  }

  $('go').addEventListener('click', renderOrder);
  ['from', 'to'].forEach(function (id) { $(id).addEventListener('input', updateDateNote); });
  $('copy').addEventListener('click', function () {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(lastText).then(function () {
        $('copy').textContent = 'Скопировано ✓';
        setTimeout(function () { $('copy').textContent = 'Скопировать список'; }, 1500);
      });
    }
  });

  // ================= МЕНЮ =================
  var menuBase = new Date();

  function renderMenu() {
    var days = A.weekDays(menuBase);
    var today = new Date();
    var html = '<div class="days">';
    days.forEach(function (d) {
      var isToday = d.date.getDate() === today.getDate() &&
                    d.date.getMonth() === today.getMonth() &&
                    d.date.getFullYear() === today.getFullYear();
      html += '<div class="daycard' + (isToday ? ' today' : '') + '">' +
              '<div class="dayhead">' + d.name + ', ' + A.fmtDate(d.date).slice(0, 5) +
              ' <span>· день ' + d.day + (isToday ? ' · сегодня' : '') + '</span></div>';
      ['Завтрак', 'Обед', 'Ужин'].forEach(function (m) {
        var rows = D.menu.filter(function (r) { return r.day_no === d.day && r.meal === m; });
        if (!rows.length) return;
        html += '<div class="mlabel">' + m + '</div>';
        rows.forEach(function (r) {
          html += '<div class="dishrow"><span class="num">' + r.num + '</span>' +
                  '<span class="name">' + r.dish + '</span>' +
                  '<span class="out">' + (r.out || '') + '</span></div>';
        });
      });
      html += '</div>';
    });
    html += '</div>';
    $('menuList').innerHTML = html;
    $('weekDate').value = A.fmtDate(days[0].date).slice(0, 5) + ' – ' + A.fmtDate(days[6].date).slice(0, 5);
  }

  $('prevWeek').addEventListener('click', function () {
    menuBase = new Date(menuBase.getFullYear(), menuBase.getMonth(), menuBase.getDate() - 7);
    renderMenu();
  });
  $('nextWeek').addEventListener('click', function () {
    menuBase = new Date(menuBase.getFullYear(), menuBase.getMonth(), menuBase.getDate() + 7);
    renderMenu();
  });
  $('weekDate').addEventListener('change', function () {
    try { menuBase = A.parseDate(val('weekDate')); renderMenu(); } catch (e) { renderMenu(); }
  });
  $('thisWeek').addEventListener('click', function () {
    menuBase = new Date();
    renderMenu();
  });

  // ================= КАРТЫ =================
  var curCard = null;

  function showCats() {
    $('cardCats').classList.remove('hidden');
    $('cardNav').classList.add('hidden');
    $('cardList').innerHTML = '';
    $('cardView').classList.add('hidden');
    $('cardNote').textContent = '';
  }

  function renderCardCats() {
    showCats();
    var html = '';
    D.card_categories.forEach(function (cat, i) {
      html += '<button class="catbtn" data-cat="' + i + '">' + cat[0] + '</button>';
    });
    $('cardCats').innerHTML = html;
    Array.prototype.forEach.call($('cardCats').children, function (btn) {
      btn.addEventListener('click', function () {
        var idx = parseInt(btn.getAttribute('data-cat'), 10);
        var pages = D.card_categories[idx][1];
        var list = D.cards.filter(function (c) { return pages.indexOf(c.page) >= 0; });
        showList(D.card_categories[idx][0], list);
      });
    });
  }

  function showList(title, list) {
    $('cardCats').classList.add('hidden');
    $('cardNav').classList.remove('hidden');
    $('cardView').classList.add('hidden');
    $('cardTitle').textContent = title + (list.length ? ' — ' + list.length : '');
    var html = '';
    list.forEach(function (c) {
      html += '<button class="cardbtn" data-page="' + c.page + '">' + c.dish +
              (c.output ? ' <span class="coutput">' + c.output + '</span>' : '') + '</button>';
    });
    $('cardList').innerHTML = html || '<div class="tip">Ничего не нашлось</div>';
    Array.prototype.forEach.call($('cardList').children, function (btn) {
      btn.addEventListener('click', function () {
        var page = parseInt(btn.getAttribute('data-page'), 10);
        openCard(D.cards.filter(function (c) { return c.page === page; })[0]);
      });
    });
  }

  function openCard(card) {
    curCard = card;
    $('cardList').classList.add('hidden');
    $('cardView').classList.remove('hidden');
    $('cardName').innerHTML = card.dish + (card.output ? ' <span class="coutput">' + card.output + '</span>' : '');
    $('cardOut').innerHTML = '';
    $('portions').value = '';
    $('portions').focus();
  }

  $('cardBack').addEventListener('click', function () {
    if (curCard) {
      curCard = null;
      $('cardView').classList.add('hidden');
      $('cardList').classList.remove('hidden');
    } else {
      showCats();
    }
  });

  function renderCardOut() {
    if (!curCard) return;
    var n = num('portions');
    if (!(n > 0)) { $('cardOut').innerHTML = '<div class="err">Напиши число порций больше нуля</div>'; return; }
    var per = curCard.per || 1;
    var lines = curCard.ing.map(function (it) {
      return '<div class="item"><span>' + it[0] + '</span><span class="qty">' +
             A.fmtQty(it[2] * n / per, it[1]) + '</span></div>';
    }).join('');
    var w = (n % 10 === 1 && n % 100 !== 11) ? 'порцию'
          : ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'порции' : 'порций');
    $('cardOut').innerHTML = '<div class="card"><div class="head">На ' + n + ' ' + w + '</div>' + lines + '</div>';
  }

  $('cardSearch').addEventListener('click', function () {
    var q = val('cardQuery');
    if (!q) { $('cardNote').textContent = 'Напиши название блюда'; return; }
    var list = A.findCards(q, D.cards);
    $('cardNote').textContent = '';
    showList('Поиск: ' + q, list);
  });
  $('cardQuery').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') $('cardSearch').click();
  });
  $('cardCalc').addEventListener('click', renderCardOut);
  $('portions').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') renderCardOut();
  });

  // ---------- старт ----------
  $('days').value = '1-3';
  setOrderMode('dates');
  renderMenu();
})();
</script>
</body>
</html>
